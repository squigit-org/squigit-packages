name: "Build Linux OCR"
description: "Builds .deb and .rpm artifacts from the OCR runtime directory"
inputs:
  ocr-version:
    description: "Semantic version used for OCR metadata"
    required: true
  runtime-dir:
    description: "OCR runtime directory path"
    required: true
  binary-name:
    description: "Executable file name to expose on PATH"
    required: true
  deb-control-template:
    description: "Path to Debian control template"
    required: true
  rpm-spec-template:
    description: "Path to RPM spec template"
    required: true
  summary:
    description: "Single-line OCR summary"
    required: true
  description-line-1:
    description: "First description line"
    required: true
  description-line-2:
    description: "Second description line"
    required: true
outputs:
  deb-path:
    description: "Absolute path to the built .deb artifact"
    value: ${{ steps.build.outputs.deb_path }}
  deb_path:
    description: "Absolute path to the built .deb artifact (underscore alias)"
    value: ${{ steps.build.outputs.deb_path }}
  deb-name:
    description: "Debian artifact file name"
    value: ${{ steps.build.outputs.deb_name }}
  deb_name:
    description: "Debian artifact file name (underscore alias)"
    value: ${{ steps.build.outputs.deb_name }}
  deb-sha256:
    description: "Debian artifact SHA256"
    value: ${{ steps.build.outputs.deb_sha256 }}
  deb_sha256:
    description: "Debian artifact SHA256 (underscore alias)"
    value: ${{ steps.build.outputs.deb_sha256 }}
  rpm-path:
    description: "Absolute path to the built .rpm artifact"
    value: ${{ steps.build.outputs.rpm_path }}
  rpm_path:
    description: "Absolute path to the built .rpm artifact (underscore alias)"
    value: ${{ steps.build.outputs.rpm_path }}
  rpm-name:
    description: "RPM artifact file name"
    value: ${{ steps.build.outputs.rpm_name }}
  rpm_name:
    description: "RPM artifact file name (underscore alias)"
    value: ${{ steps.build.outputs.rpm_name }}
  rpm-sha256:
    description: "RPM artifact SHA256"
    value: ${{ steps.build.outputs.rpm_sha256 }}
  rpm_sha256:
    description: "RPM artifact SHA256 (underscore alias)"
    value: ${{ steps.build.outputs.rpm_sha256 }}
runs:
  using: "composite"
  steps:
    - name: Build Linux OCR artifacts
      id: build
      shell: bash
      env:
        OCR_VERSION: ${{ inputs.ocr-version }}
        RUNTIME_DIR: ${{ inputs.runtime-dir }}
        BINARY_NAME: ${{ inputs.binary-name }}
        DEB_CONTROL_TEMPLATE: ${{ inputs.deb-control-template }}
        RPM_SPEC_TEMPLATE: ${{ inputs.rpm-spec-template }}
        SUMMARY: ${{ inputs.summary }}
        DESCRIPTION_LINE_1: ${{ inputs.description-line-1 }}
        DESCRIPTION_LINE_2: ${{ inputs.description-line-2 }}
      run: |
        set -euo pipefail
        "${{ github.action_path }}/build.sh"
